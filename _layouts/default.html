<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}Tweed theme for Shopify</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="site-header">
      <div class="wrap site-header__inner">
        <a class="brand" href="{{ '/' | relative_url }}">Tweed <span>theme documentation</span></a>
        <nav aria-label="Documentation">
          <ul>
            <li><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Guide</a></li>
            <li><a href="{{ '/reference/' | relative_url }}"{% if page.url == '/reference/' %} aria-current="page"{% endif %}>Settings reference</a></li>
            <li><a href="{{ '/faq/' | relative_url }}"{% if page.url == '/faq/' %} aria-current="page"{% endif %}>FAQ</a></li>
            <li><a href="{{ '/support/' | relative_url }}"{% if page.url == '/support/' %} aria-current="page"{% endif %}>Support</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main id="content" class="wrap content">
      {{ content }}
    </main>
    <footer class="site-footer">
      <div class="wrap">
        <p>Tweed is a Shopify theme by {{ site.author }}. Questions about the theme: <a href="{{ '/support/' | relative_url }}">contact support</a>.</p>
      </div>
    </footer>
  </body>
</html>
